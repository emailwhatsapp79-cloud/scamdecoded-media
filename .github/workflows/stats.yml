name: Collect video stats
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}
  push:
    paths: ["tracker/**"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U yt-dlp
      - run: python tracker/collect.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Save results
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update stats"
          git pull --rebase -q origin main && git push -q origin main
